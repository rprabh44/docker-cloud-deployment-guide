services:
  api:
    build: ./app
    container_name: compose-postgres-api
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: jobs_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: compose-postgres-db
    environment:
      POSTGRES_DB: jobs_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
